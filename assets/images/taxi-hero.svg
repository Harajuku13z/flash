<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2255;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0070FF;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#111;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- City skyline silhouette -->
  <rect x="0" y="200" width="800" height="300" fill="#0d1b3e" opacity="0.6"/>
  <!-- Buildings -->
  <rect x="50" y="180" width="60" height="150" fill="#0a1628" rx="3"/>
  <rect x="80" y="160" width="25" height="20" fill="#0a1628"/>
  <rect x="130" y="150" width="80" height="180" fill="#091525" rx="3"/>
  <rect x="155" y="130" width="20" height="25" fill="#091525"/>
  <rect x="220" y="170" width="50" height="160" fill="#0a1628" rx="3"/>
  <rect x="580" y="160" width="70" height="170" fill="#0a1628" rx="3"/>
  <rect x="600" y="140" width="25" height="22" fill="#091525"/>
  <rect x="660" y="175" width="55" height="155" fill="#091525" rx="3"/>
  <rect x="720" y="185" width="60" height="145" fill="#0a1628" rx="3"/>
  <!-- Building windows -->
  <rect x="60" y="195" width="8" height="10" fill="#FFC400" opacity="0.7"/>
  <rect x="80" y="195" width="8" height="10" fill="#FFC400" opacity="0.4"/>
  <rect x="60" y="215" width="8" height="10" fill="#FFC400" opacity="0.5"/>
  <rect x="80" y="215" width="8" height="10" fill="#FFC400" opacity="0.8"/>
  <rect x="145" y="165" width="8" height="10" fill="#FFC400" opacity="0.6"/>
  <rect x="165" y="165" width="8" height="10" fill="#FFC400" opacity="0.3"/>
  <rect x="185" y="165" width="8" height="10" fill="#FFC400" opacity="0.7"/>
  <rect x="590" y="175" width="8" height="10" fill="#FFC400" opacity="0.5"/>
  <rect x="610" y="175" width="8" height="10" fill="#FFC400" opacity="0.8"/>
  <rect x="630" y="175" width="8" height="10" fill="#FFC400" opacity="0.4"/>
  <!-- Road -->
  <rect x="0" y="380" width="800" height="120" fill="#1a1a1a"/>
  <!-- Road markings -->
  <rect x="200" y="430" width="80" height="8" fill="#FFC400" opacity="0.6" rx="4"/>
  <rect x="360" y="430" width="80" height="8" fill="#FFC400" opacity="0.6" rx="4"/>
  <rect x="520" y="430" width="80" height="8" fill="#FFC400" opacity="0.6" rx="4"/>
  <!-- Taxi car body -->
  <rect x="270" y="310" width="260" height="90" fill="#FFC400" rx="12"/>
  <!-- Taxi roof -->
  <rect x="310" y="265" width="180" height="55" fill="#FFC400" rx="10"/>
  <!-- Car windows -->
  <rect x="320" y="273" width="75" height="40" fill="#5B8FD4" opacity="0.8" rx="6"/>
  <rect x="405" y="273" width="75" height="40" fill="#5B8FD4" opacity="0.8" rx="6"/>
  <!-- Taxi sign on roof -->
  <rect x="365" y="252" width="70" height="22" fill="#0070FF" rx="6"/>
  <text x="400" y="267" fill="#fff" font-family="Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TAXI</text>
  <!-- Wheels -->
  <circle cx="330" cy="400" r="28" fill="#222"/>
  <circle cx="330" cy="400" r="18" fill="#444"/>
  <circle cx="330" cy="400" r="8" fill="#666"/>
  <circle cx="470" cy="400" r="28" fill="#222"/>
  <circle cx="470" cy="400" r="18" fill="#444"/>
  <circle cx="470" cy="400" r="8" fill="#666"/>
  <!-- Headlights -->
  <ellipse cx="530" cy="345" rx="12" ry="8" fill="#FFF9C4" opacity="0.9"/>
  <ellipse cx="270" cy="345" rx="12" ry="8" fill="#FFF9C4" opacity="0.4"/>
  <!-- Light beams -->
  <polygon points="542,341 620,320 620,370 542,349" fill="#FFFDE7" opacity="0.15"/>
  <!-- Stars/city lights -->
  <circle cx="100" cy="80" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="200" cy="50" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="350" cy="30" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="500" cy="60" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="650" cy="40" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="750" cy="70" r="1.5" fill="#fff" opacity="0.6"/>
  <!-- Flash brand glow -->
  <circle cx="400" cy="200" r="150" fill="#0070FF" opacity="0.05"/>
</svg>
